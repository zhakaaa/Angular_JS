<nav class="navbar">
  <div class="logo" routerLink="/">Rick & Morty Hub 🛸</div>

  <div class="nav-links">
    <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}">Home</a>

    <a routerLink="/favorites" routerLinkActive="active">Favorites</a>
    <a routerLink="/profile" routerLinkActive="active">Profile</a>

    @if (authService.user$ | async; as currentUser) {
      <a routerLink="/characters" routerLinkActive="active">Browse</a>
      <span class="user-info">{{ currentUser.email }}</span>
      <button (click)="handleLogout()" class="btn-logout">Logout</button>
    } @else {
      <a routerLink="/login" routerLinkActive="active">Log In</a>
      <a routerLink="/signup" class="btn-signup">Sign Up</a>
    }


  </div>
</nav>
